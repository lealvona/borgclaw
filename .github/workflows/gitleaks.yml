name: gitleaks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run gitleaks (license-free binary)
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar xzf gl.tgz gitleaks
          ./gitleaks version
          ./gitleaks git --redact --no-banner --exit-code 1
          rm -f gl.tgz gitleaks
